name: Build Zeal Docset (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install markdown beautifulsoup4 doc2dash

      - name: Create folders
        run: |
          mkdir build_html
          mkdir download

      - name: Convert Markdown → HTML
        run: |
          set PYTHONIOENCODING=utf-8
          python tools/build_html.py

      - name: Debug build_html
        run: dir build_html

      - name: Build Zeal Docset (FIXED)
        run: |
          doc2dash build_html -n MyDocs --index-page index.html

      - name: Move docset to download
        run: |
          move MyDocs.docset download/

      - name: Install 7zip
        run: choco install 7zip -y

      - name: Compress (7z ultra split 49MB)
        run: |
          7z a -t7z -mx=9 -v49m download/MyDocs.7z download/MyDocs.docset

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeal-docset
          path: download/
