name: Build Full Zeal Docset (Searchable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          pip install markdown beautifulsoup4
          pip install doc2dash

      - name: Create folders
        run: |
          mkdir build_html
          mkdir download

      - name: Convert Markdown → HTML (with index-ready structure)
        run: python tools/build_html.py

      - name: Build Zeal Docset (with index)
        run: |
          doc2dash build_html -n MyDocs --index-page index.html

      - name: Move docset
        run: |
          move MyDocs.docset download/

      - name: Install 7zip
        run: choco install 7zip -y

      - name: Compress (7z ultra + 49MB split)
        run: |
          7z a -t7z -mx=9 -v49m download/MyDocs.7z download/MyDocs.docset

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeal-docset
          path: download/
